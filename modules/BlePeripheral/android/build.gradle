plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.bleperipheral'
version = '0.1.0'

android {
  namespace "expo.modules.bleperipheral"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // HeadlessJsTaskService (background relay) lives in react-android.
  implementation 'com.facebook.react:react-android'
}
