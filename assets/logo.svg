<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect x="0" y="0" width="1024" height="1024" fill="#08090a"/>
  <!-- mesh links (behind bubble) -->
  <g stroke="#454e50" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="830" y1="262" x2="800" y2="200"/>
    <line x1="800" y1="200" x2="720" y2="190"/>
    <line x1="720" y1="190" x2="830" y2="262"/>
  </g>
  <!-- speech bubble with tail at bottom-left -->
  <path d="M360 250 H650 A110 110 0 0 1 760 360 V510 A110 110 0 0 1 650 620 H430 L290 730 L318 620 H360 A110 110 0 0 1 250 510 V360 A110 110 0 0 1 360 250 Z"
        fill="none" stroke="#d8f24b" stroke-width="36" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- bluetooth rune -->
  <path d="M440 400 L580 500 L508 560 V310 L580 370 L440 470"
        fill="none" stroke="#57d4e6" stroke-width="30" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- mesh nodes -->
  <circle cx="830" cy="262" r="16" fill="#5ce65c"/>
  <circle cx="800" cy="200" r="16" fill="#f2a93b"/>
  <circle cx="720" cy="190" r="16" fill="#57d4e6"/>
</svg>
